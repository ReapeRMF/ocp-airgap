---
- name: Prepare full airgap package (online only)
  when: online_mode | default(true)
  block:
    - name: Clean staging directory
      ansible.builtin.file:
        path: "{{ staging_dir }}"
        state: absent

    - name: Create staging directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ staging_dir }}"
        - "{{ staging_dir }}/rpm_packages"
        - "{{ staging_dir }}/python_wheels"
        - "{{ staging_dir }}/ansible_collections"
        - "{{ staging_dir }}/discovery"
        - "{{ staging_dir }}/ipxe_binaries"

    # Reuse seeding logic
    - name: Download RPMs and dependencies
      ansible.builtin.command: >-
        dnf download --resolve --alldeps
        --destdir="{{ staging_dir }}/rpm_packages"
        -y ipmitool OpenIPMI
      changed_when: true

    - name: Load pinned iPXE checksums
      ansible.builtin.include_vars:
        file: "{{ role_path }}/../../vars/ipxe_checksums.yml"

    - name: Require pinned iPXE checksums
      ansible.builtin.assert:
        that:
          - ipxe_pxe_checksum | default('') | length > 0
        fail_msg: >-
          ipxe_pxe_checksum is required. See vars/ipxe_checksums.yml.
          Pass -e allow_unverified_ipxe=true only when you accept a rolling binary.
      when: not (allow_unverified_ipxe | default(false) | bool)

    - name: Download iPXE binaries
      ansible.builtin.get_url:
        url: "{{ ipxe_pxe_url }}"
        dest: "{{ staging_dir }}/ipxe_binaries/ipxe.pxe"
        mode: '0644'
        checksum: "{{ omit if (allow_unverified_ipxe | default(false) | bool) else ipxe_pxe_checksum }}"

    - name: Download Python wheels
      ansible.builtin.command: >-
        pip3 download gunicorn flask -d "{{ staging_dir }}/python_wheels"
      changed_when: true

    - name: Download Ansible collections
      ansible.builtin.command: >-
        ansible-galaxy collection download
        -r "{{ playbook_dir }}/../requirements.yml"
        -p "{{ staging_dir }}/ansible_collections"
      changed_when: true

    # Build the IPA image
    - name: Build CentOS Stream 9 IPA discovery image
      ansible.builtin.include_role:
        name: hw_discovery
        tasks_from: build-ipa.yml

    - name: Package discovery image
      community.general.archive:
        path: "{{ ipa_output_dir }}"
        dest: "{{ staging_dir }}/{{ discovery_image_archive }}"
        format: gz
        mode: '0644'

    - name: Create full airgap bundle
      community.general.archive:
        path: "{{ staging_dir }}"
        dest: "{{ playbook_dir }}/../{{ airgap_bundle_name }}"
        format: gz
        mode: '0644'
