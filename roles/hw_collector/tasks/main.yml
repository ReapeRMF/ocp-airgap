---
- name: Create collector group
  ansible.builtin.group:
    name: "{{ collector_group }}"
    system: true

- name: Create collector user
  ansible.builtin.user:
    name: "{{ collector_user }}"
    group: "{{ collector_group }}"
    system: true
    shell: /sbin/nologin
    home: "{{ collector_dir }}"

- name: Ensure the collector bearer token
  ansible.builtin.include_tasks: token.yml

# Securely initializes code home, raw data storage, and the web-accessible PXE nextboot directory
- name: Create collector directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ collector_user }}"
    group: "{{ collector_group }}"
    mode: '0755'
  loop:
    - "{{ collector_dir }}"
    - "{{ collector_data_dir | default('/var/lib/hardware-inventory') }}"
    - "{{ pxe_http_root | default('/var/www/html') }}/nextboot"

- name: Install python3 and gunicorn (system packages)
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-virtualenv
    state: present

- name: Check if offline wheel directory exists
  ansible.builtin.stat:
    path: "{{ offline_wheel_dir }}"
  register: hw_collector_wheel_dir_stat

- name: Create virtualenv and install from local wheels (air-gapped mode)
  ansible.builtin.pip:
    name:
      - gunicorn==23.0.0
      - flask==3.1.2
      - werkzeug==3.1.9
    virtualenv: "{{ collector_venv }}"
    virtualenv_command: /usr/bin/python3 -m venv
    extra_args: "--find-links {{ offline_wheel_dir }} --no-index"
  when: hw_collector_wheel_dir_stat.stat.exists

- name: Create virtualenv and install from PyPI (connected mode)
  ansible.builtin.pip:
    name:
      - gunicorn==23.0.0
      - flask==3.1.2
      - werkzeug==3.1.9
    virtualenv: "{{ collector_venv }}"
    virtualenv_command: /usr/bin/python3 -m venv
  when: not hw_collector_wheel_dir_stat.stat.exists

- name: Deploy collector application
  ansible.builtin.copy:
    src: collector_app.py
    dest: "{{ collector_dir }}/collector_app.py"
    owner: "{{ collector_user }}"
    group: "{{ collector_group }}"
    mode: "0644"
  notify: Restart hw_collector

- name: Deploy systemd service for the collector
  ansible.builtin.template:
    src: hw_collector.service.j2
    dest: /etc/systemd/system/hw_collector.service
    mode: '0644'
  notify: Restart hw_collector

- name: Check whether firewalld is active
  ansible.builtin.systemd:
    name: firewalld
  register: hw_collector_firewalld
  failed_when: false

- name: Require an active firewall before publishing the collector
  ansible.builtin.assert:
    that:
      - hw_collector_firewalld.status is defined
      - hw_collector_firewalld.status.ActiveState | default('') == 'active'
      - pxe_subnet is defined
      - pxe_subnet | length > 0
    fail_msg: >-
      firewalld is not active or pxe_subnet is unset. The collector is not
      started without a rule limiting port {{ collector_port }}/tcp to the
      provisioning subnet. Start firewalld, or pass -e collector_skip_firewalld=true.
  when: not (collector_skip_firewalld | bool)

- name: Limit the collector port to the provisioning subnet
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="ipv4" source address="{{ pxe_subnet }}"
      port port="{{ collector_port }}" protocol="tcp" accept
    permanent: true
    immediate: true
    state: enabled
  when: not (collector_skip_firewalld | bool)

- name: Enable and start collector service
  ansible.builtin.service:
    name: hw_collector
    state: started
    enabled: true
