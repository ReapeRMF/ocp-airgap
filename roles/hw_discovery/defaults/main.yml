---
# hw_discovery role defaults
# These are the values used if not overridden in group_vars or host_vars.

pxe_http_root: /var/www/html
ipa_output_dir: "{{ pxe_http_root }}/discovery"
collector_port: 5000
collector_dir: /var/lib/hardware-inventory
bastion_ip: "{{ ansible_default_ipv4.address | default('192.168.50.10') }}"

# Image builds run from build_and_deploy_discovery_image.yml, which calls
# build-ipa.yml directly. setup_bastion does not rebuild unless this is true.
build_ipa_image: false

# In-band probing is separate from "do not build an image".
# setup_bastion does not probe the bastion unless this is true.
inband_discovery: false

# Where the prepared offline artifacts live after extraction
offline_artifacts_dir: /opt/offline-artifacts-x86_64
