---
# roles/hw_discovery/tasks/deploy_ipxe_menu.yml
# Deploys the iPXE boot menu (rendered from template)

- name: Ensure the collector token is available to the boot menu
  ansible.builtin.include_role:
    name: hw_collector
    tasks_from: token.yml
  become: true

- name: Ensure iPXE directory exists
  ansible.builtin.file:
    path: /var/www/html/ipxe
    state: directory
    mode: '0755'
  become: true

- name: Deploy iPXE boot menu
  ansible.builtin.template:
    src: ipxe/boot.ipxe.j2
    dest: /var/www/html/ipxe/boot.ipxe
    mode: '0644'
  become: true
  notify: Restart httpd

- name: Require the provisioning subnet before publishing the boot menu
  ansible.builtin.assert:
    that:
      - pxe_subnet is defined
      - pxe_subnet | length > 0
    fail_msg: >-
      Set pxe_subnet. httpd will only serve /ipxe to that subnet because
      boot.ipxe contains the enroll token.

- name: Install httpd
  ansible.builtin.package:
    name: httpd
    state: present
  become: true

- name: Restrict /ipxe to the provisioning subnet
  ansible.builtin.template:
    src: httpd/ipxe.conf.j2
    dest: /etc/httpd/conf.d/ipxe-discovery.conf
    mode: "0644"
  become: true
  notify: Restart httpd

- name: Enable httpd
  ansible.builtin.service:
    name: httpd
    state: started
    enabled: true
  become: true
