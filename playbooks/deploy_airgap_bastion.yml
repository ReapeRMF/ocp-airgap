---
- name: Air-Gapped Bastion Infrastructure Installation
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/../vars/rpm_gpg_keys.yml"

  vars:
    # Resolve the running user's actual home directory before privilege escalation
    real_user_home: "{{ lookup('env', 'HOME') }}"
    airgap_staging_dir: "{{ real_user_home }}/ansible/airgap_payload"

  tasks:
    - name: Validate that local staging folder exists
      ansible.builtin.stat:
        path: "{{ airgap_staging_dir }}"
      register: staging_stat
      failed_when: not staging_stat.stat.exists

    - name: Require the out-of-band SHA256SUMS digest
      ansible.builtin.assert:
        that:
          - airgap_sha256sums_digest is defined
          - airgap_sha256sums_digest is match('^[0-9a-f]{64}$')
        fail_msg: >-
          Pass -e airgap_sha256sums_digest=<64 lowercase hex characters>
          from airgap_sha256sums.sha256 on the online host.
          The digest is not inside the archive.

    - name: Verify SHA256SUMS matches the out-of-band digest
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          printf '%s  SHA256SUMS\n' "{{ airgap_sha256sums_digest }}" | sha256sum -c -
        executable: /bin/bash
      args:
        chdir: "{{ airgap_staging_dir }}"
      changed_when: false
      check_mode: false

    - name: Verify the staged bundle against SHA256SUMS
      ansible.builtin.command: sha256sum -c SHA256SUMS
      args:
        chdir: "{{ airgap_staging_dir }}"
      changed_when: false
      check_mode: false

    - name: Read SHA256SUMS
      ansible.builtin.slurp:
        src: "{{ airgap_staging_dir }}/SHA256SUMS"
      register: deploy_sums_file

    - name: Parse paths named in SHA256SUMS
      ansible.builtin.set_fact:
        deploy_sums_relpaths: >-
          {{
            (deploy_sums_file.content | b64decode).splitlines()
            | map('regex_replace', '^[0-9a-fA-F]+  ', '')
            | map('regex_replace', '^\\./', '')
            | list
          }}

    - name: Find every file in the staged bundle
      ansible.builtin.find:
        paths: "{{ airgap_staging_dir }}"
        recurse: true
        file_type: file
      register: deploy_bundle_files

    - name: Reject bundle files that SHA256SUMS does not name
      ansible.builtin.assert:
        that:
          - (item.path | relpath(airgap_staging_dir)) in deploy_sums_relpaths
        fail_msg: >-
          {{ item.path | relpath(airgap_staging_dir) }} is in the bundle
          but not named in SHA256SUMS. Refusing to install anything.
      loop: "{{ deploy_bundle_files.files }}"
      when: (item.path | relpath(airgap_staging_dir)) != 'SHA256SUMS'

    - name: Load pinned collection requirements
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../requirements.yml"
        name: deploy_requirements

    - name: Create local temporary user collection path
      ansible.builtin.file:
        path: "{{ real_user_home }}/.ansible/collections"
        state: directory
        mode: '0755'
      become: false

    - name: Require the collection archive pinned in requirements.yml
      ansible.builtin.stat:
        path: >-
          {{ airgap_staging_dir }}/ansible_collections/{{ item.name | replace('.', '-') }}-{{ item.version }}.tar.gz
      loop: "{{ deploy_requirements.collections }}"
      register: deploy_pinned_collections
      become: false

    - name: Fail when a pinned collection archive is missing
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: >-
          Missing {{ item.item.name }} {{ item.item.version }}
          under ansible_collections. The bundle must contain that exact file.
      loop: "{{ deploy_pinned_collections.results }}"

    - name: Install only collection archives pinned in requirements.yml
      ansible.builtin.command: >-
        ansible-galaxy collection install
        {{ airgap_staging_dir }}/ansible_collections/{{ item.name | replace('.', '-') }}-{{ item.version }}.tar.gz
        --force
      loop: "{{ deploy_requirements.collections }}"
      changed_when: true
      become: false

    - name: Gather all downloaded offline RPM packages
      ansible.builtin.find:
        paths: "{{ airgap_staging_dir }}/rpm_packages"
        patterns: "*.rpm"
      register: found_rpms

    - name: Filter out core system and release packages that cause conflicts
      ansible.builtin.set_fact:
        install_rpms: >-
          {{
            found_rpms.files
            | map(attribute='path')
            | reject('search', 'fedora-release')
            | reject('search', 'systemd')
            | reject('search', 'glibc')
            | reject('search', 'bash')
            | reject('search', 'coreutils')
            | reject('search', 'setup')
            | reject('search', 'filesystem')
            | list
          }}

    - name: Find bundled RPM signing keys
      ansible.builtin.find:
        paths: "{{ airgap_staging_dir }}/rpm_gpg_keys"
        patterns: "RPM-GPG-KEY-*"
      register: deploy_gpg_keys

    - name: Require bundled RPM signing keys
      ansible.builtin.assert:
        that:
          - deploy_gpg_keys.matched > 0
        fail_msg: >-
          The air-gap bundle has no rpm_gpg_keys. Re-run seed_airgap_bundle.yml
          so the bastion can verify RPM signatures.

    - name: Fingerprint bundled RPM signing keys
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          gpg --batch --with-colons --import-options show-only --import "{{ item.path }}" \
            | awk -F: '$1 == "fpr" { print toupper($10) }'
        executable: /bin/bash
      register: deploy_gpg_fpr
      changed_when: false
      loop: "{{ deploy_gpg_keys.files }}"

    - name: Require each bundled key file to hold exactly one pinned key
      ansible.builtin.assert:
        that:
          - item.stdout_lines | length == 1
          - item.stdout_lines[0] in rpm_gpg_key_fingerprints
        fail_msg: >-
          {{ item.item.path | basename }} has fingerprints {{ item.stdout_lines }}.
          Each file must contain exactly one key, and that key must be listed
          in vars/rpm_gpg_keys.yml.
      loop: "{{ deploy_gpg_fpr.results }}"

    - name: Import pinned RPM signing keys
      ansible.builtin.rpm_key:
        key: "{{ item.path }}"
        state: present
      loop: "{{ deploy_gpg_keys.files }}"

    - name: Install host system dependencies concurrently via batch DNF
      ansible.builtin.dnf:
        name: "{{ install_rpms }}"
        state: present
        # Group vars and -e can override this. Default is verify signatures.
        disable_gpg_check: "{{ airgap_disable_gpg_check | default(false) | bool }}"

    - name: Create baseline directory structure for boot files and inventory
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "/var/lib/hardware-inventory"
        - "/var/www/html/ipxe"

    - name: Check iPXE bootstrap binaries from the bundle
      ansible.builtin.stat:
        path: "{{ airgap_staging_dir }}/ipxe_binaries/{{ item }}"
      loop:
        - ipxe.pxe
        - ipxe.efi
      register: deploy_ipxe_stats

    - name: Require both iPXE bootstrap binaries
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: >-
          Missing {{ item.item }} under {{ airgap_staging_dir }}/ipxe_binaries.
          Re-run seed_airgap_bundle.yml so the bundle contains ipxe.pxe and ipxe.efi.
      loop: "{{ deploy_ipxe_stats.results }}"

    - name: Copy stable bootstrap binaries to local TFTP/HTTP roots
      ansible.builtin.copy:
        src: "{{ airgap_staging_dir }}/ipxe_binaries/{{ item }}"
        dest: "/var/www/html/ipxe/{{ item }}"
        mode: '0644'
      loop:
        - "ipxe.pxe"
        - "ipxe.efi"
