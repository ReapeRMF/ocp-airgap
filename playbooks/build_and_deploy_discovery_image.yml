---
# build_and_deploy_discovery_image.yml
- name: Build and deploy discovery image
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    ipa_output_dir: "/var/www/html/discovery"
    collector_port: 5000
    # This play calls build-ipa.yml directly. The flag documents that intent
    # for anything else in the role that consults it.
    build_ipa_image: true

  tasks:
    - name: Execute internal dynamic agent image build
      ansible.builtin.include_role:
        name: hw_discovery
        tasks_from: build-ipa.yml
